name: Build EchoSMP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven Build ausfuehren
        run: mvn --batch-mode clean package
      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: scoreboardpluginah
          path: target/scoreboardpluginah.jar

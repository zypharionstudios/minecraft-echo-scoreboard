name: Build EchoSMP

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Gradle Build ausführen
        uses: gradle/actions/setup-gradle@v4
      - run: gradle build
      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: EchoSMP
          path: build/libs/EchoSMP-*.jar
